<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- external CSS link -->
	<link rel="stylesheet" href="css/normalize.css">
	<link rel="stylesheet" href="css/style.css">
    <title>Calculator</title>
</head>
<body>
    <section id="calculator">
        <h1 id="result"></h1>
        <section id="keypad">
            <h2 class="key" id="7">7</h2>
            <h2 class="key" id="8">8</h2>
            <h2 class="key" id="9">9</h2>
            <h2 class="key" id="/">/</h2>
            <h2 class="key" id="4">4</h2>
            <h2 class="key" id="5">5</h2>
            <h2 class="key" id="6">6</h2>
            <h2 class="key" id="X">X</h2>
            <h2 class="key" id="1">1</h2>
            <h2 class="key" id="2">2</h2>
            <h2 class="key" id="3">3</h2>
            <h2 class="key" id="+">+</h2>
            <h2 class="key" id="0">0</h2>
            <h2 class="key" id=".">.</h2>
            <h2 class="key" id="=">=</h2>
            <h2 class="key" id="-">-</h2>
        </section>
    </section>
</body>

</html>
